name: nylo_support
description: Support library for the Nylo framework. This library supports routing, widgets, localization, cli, storage and more.
version: 7.27.5
homepage: https://nylo.dev
repository: https://github.com/nylo-core/support/tree/7.x
issue_tracker: https://github.com/nylo-core/support/issues
documentation: https://github.com/nylo-core/support
funding:
  - https://github.com/sponsors/agordn52
topics:
  - micro-framework
  - framework

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  collection: ^1.19.1
  service_runner: ^1.0.0
  flutter_secure_storage: ^10.3.1
  flutter_staggered_grid_view: ^0.7.0
  dio: ^5.11.0
  recase: ^4.1.0
  get_time_ago: ^2.4.1
  flutter_styled_toast: ^2.3.0
  pull_to_refresh_flutter3: ^2.0.2
  equatable: ^2.1.0
  rxdart: ^0.28.0
  intl: ^0.20.3
  skeletonizer: ^2.1.3
  error_stack: ^2.1.5
  date_field: ^6.0.3+1
  flutter_multi_formatter: ^2.13.11
  flutter_local_notifications: ^22.3.0
  path_provider: ^2.1.6
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  app_badge_plus: ^1.3.4
  mask_text_input_formatter: ^2.9.0
  uuid: ^4.6.0
  characters: ^1.4.1
  connectivity_plus: ^7.3.1
  url_launcher: ^6.3.2
  app_links: ^7.2.1
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter:
    sdk: flutter

  flutter_test:
    sdk: flutter

  ffi: ^2.2.0
  win32: ^6.4.0
dev_dependencies:
  patrol: ^4.9.0
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

screenshots:
  - description: The Nylo package logo.
    path: screenshots/logo.png

# The following section is specific to Flutter.
flutter:
  uses-material-design: true
